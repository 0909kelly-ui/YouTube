name: One-time travel intro render
on:
  push:
    branches: [main]
    paths: ['.github/workflows/render-travel-intro-once.yml']
permissions:
  contents: read
jobs:
  render:
    if: github.event.head_commit.message == 'Run one-time authorized travel intro render'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install rendering tools
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Render and validate
        run: python scripts/render_travel_intro.py
      - name: Save completed video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos/travel_intro_8s.mp4 videos/travel_preview.png videos/hotel_illustration.png videos/travel_validation.json
          git commit -m "Save validated 1080p eight-second travel intro"
          git push
      - name: Remove this one-time workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/render-travel-intro-once.yml
          git commit -m "Remove completed one-time rendering workflow"
          git push
